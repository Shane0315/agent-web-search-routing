# web-search-routing 渠道注册表
# =====================================================
# 这是 Skill 的「渠道层」：定义所有可用的搜索渠道及其能力/成本。
# 用户根据自己的环境编辑此文件：删除没装的渠道，或调整优先级。
#
# 分级（成本档位，由 Skill 决策逻辑使用）：
#   tier0 = 订阅内置搜索（沉没成本，边际成本≈0，仅订阅制用户有）
#   tier1 = 免费额度渠道（注册即有免费额度）
#   tier2 = 按量付费渠道（按次/按 token 计费）
#
#   tier1_order = Tier1 内部优先级（v3.4：零成本自建渠道最优先）
#
# capability: 该渠道能覆盖的能力维度（W1-W8，见 SKILL.md）
# required:   是否必选渠道（缺失时 Skill 会引导用户安装，而不是静默降级）
# w3_role:    W3 两阶段管线中的角色（discover=发现 / verify=核验 / confirm=确认）
# =====================================================

version: "3.4.0"

channels:
  # ───────────── Tier 0：订阅内置搜索（沉没成本）─────────────
  gpt-web-search:
    name: "GPT 内置搜索 (ChatGPT 订阅)"
    tier: 0
    harness: ["chatgpt-desktop", "codex", "chatgpt-web"]
    capability: [W1, W2, W4, W5, W6, W7]
    cost: "订阅内，边际成本≈0"
    required: false
    detect: "环境工具列表含 web_search / web_search_exa（Codex/ChatGPT 订阅自动拥有）"
    note: "搜索引擎索引级，抓不到社交平台原生内容（W3 弱）；对 W8 实操排障/生活经验类问题命中率低，SEO 内容常不可用"

  claude-web-search:
    name: "Claude 内置搜索 (Claude 订阅)"
    tier: 0
    harness: ["claude-code", "claude-desktop"]
    capability: [W1, W2, W4, W5, W6, W7]
    cost: "订阅内，边际成本≈0"
    required: false
    detect: "环境工具列表含 WebSearch"
    note: "同样抓不到社交平台原生内容（W3 弱）；W8 实操排障类问题不应作为首发渠道"

  # ───────────── Tier 1：免费渠道 ─────────────
  # v3.4：Tier1 内部分两类——「零成本自建」（无额度上限）和「注册免费额度」（有月度上限）。
  # 排序见文末 tier1_order：自建渠道可用时永远先试，注册额度渠道退为兜底。

  searxng-local:
    name: "SearXNG 本地自建（元搜索聚合）"
    tier: 1
    harness: ["proma", "claude-code", "codex", "generic-cli"]
    capability: [W1, W2, W4, W5, W6, W7]
    cost: "$0 完全免费·无额度上限·无 API Key"
    required: false   # ← 可选增强：不装不影响 Skill 任何现有路径，只是多用点额度
    priority_hint: "tier1 内最优先——零边际成本，可用时应在 Tavily/Firecrawl/Brave 之前尝试"
    detect: "curl -m 5 --noproxy '*' 'http://127.0.0.1:8888/search?q=ping&format=json' 返回 200；或 ~/.local/bin/searxng.sh --health 输出 ✅"
    endpoint: "http://127.0.0.1:8888/search?q=<query>&format=json"
    tool_ref: |
      封装脚本 ~/.local/bin/searxng.sh（装后自动生成）：
        searxng.sh "查询词" -n 10     # 精简 JSON（默认，省上下文）
        searxng.sh "查询词" --md      # Markdown 列表（人读友好）
        searxng.sh "查询词" --raw     # 原始完整 JSON
        searxng.sh --health           # 健康检查
      Bang 语法做垂直检索（其他渠道做不到）：!github / !so / !arxiv / !wp / !bd
    install: |
      # 一键安装（推荐让 Agent 代跑，只有代理需要确认）：
      #   bash install-searxng.sh
      # 脚本会完成：clone 源码 → uv venv(Python 3.12) → 写 settings.yml
      # （开 JSON API + 关 limiter + 随机 secret key + 可选代理）→ launchd 自启
      # → 安装 searxng.sh / websearch-free.sh 封装 → 健康验证。
      # 可重复运行（幂等），升级用 git pull 后重启。
      #
      # 源码：~/searxng-src；配置：~/.config/searxng/settings.yml；
      # 自启：launchd com.searxng.local（macOS；Linux 见脚本尾部手动指引）。
      #
      # 零成本全文链路（可选，需要本地 Jina Reader）：
      #   websearch-free.sh "查询词" -k 3    # SearXNG 发现 + Jina Reader 提取全文
      #
      # 故障恢复：launchctl kickstart -k gui/$(id -u)/com.searxng.local
      # 日志：~/.local/state/searxng/searxng.error.log
    note: |
      聚合 Google/Bing/Wikipedia/百度/360 + GitHub/StackOverflow/arXiv 垂直引擎。
      适合频繁搜索的用户：一次部署后通用搜索零边际成本，Tavily/Firecrawl/Brave
      的月度额度焦虑基本消除。
      短板：① 返回标题+URL+短摘要，不是 LLM-ready 清洗正文 → 需要正文时接
      Jina Reader（websearch-free.sh 已封装）或浏览器；② 中文深度仍弱于智谱 Pro；
      ③ W3 社交口碑无能力，仍需 Museon + Agent Reach；④ W8 实操排障仍应社交首发。
      经共享代理出口 IP 使用时部分引擎（DDG/Brave/Startpage/qwant/sogou）会触发
      验证码，install-searxng.sh 已默认禁用它们保响应速度，主力为
      Google/Bing/百度/360/Wikipedia/mojeek。

  tavily:
    name: "Tavily (Proma WebSearch 直连)"
    tier: 1
    harness: ["proma"]
    capability: [W1, W2, W4, W6, W7]
    cost: "1000 credits/月（免费，月度重置；超出 $0.008/credit）"
    required: false
    tool_ref: "WebSearch；参数 query/maxResults(日常3-5)/searchDepth/includeDomains；返回 answer 概要 + results[]"
    install: |
      # 1. 注册 https://app.tavily.com
      # 2. 创建 API Key（tvly-xxx）
      # 3. 配置到 Proma 的 chat-tools.json：
      #    { "toolCredentials": { "web-search": { "useCloud": "false", "apiKey": "tvly-xxx" } } }
      #    useCloud 必须 false：true 走云端共享池会报 402
    note: "英文事实/通用搜索首选，免费额度充足；W8 实操排障弱（1 分），不首发"

  firecrawl:
    name: "Firecrawl (API)"
    tier: 1
    harness: ["proma", "claude-code", "codex", "generic-cli"]
    capability: [W1, W2, W4, W6, W7]
    cost: "500 credits/月（免费，月度重置）"
    required: false
    tool_ref: "REST API：POST /v1/search（搜索）、POST /v1/scrape（抓取）；无公开余额端点，额度去 https://firecrawl.dev/dashboard 查看"
    install: |
      # 1. 注册 https://firecrawl.dev，创建 API Key（fc-xxx）
      # 2. 写入环境变量（~/.zshrc 或 ~/.bashrc）：
      #    export FIRECRAWL_API_KEY="fc-xxx"
      # 3. curl 示例：
      #    curl -X POST https://api.firecrawl.dev/v1/search \
      #      -H "Authorization: Bearer $FIRECRAWL_API_KEY" \
      #      -H "Content-Type: application/json" \
      #      -d '{"query":"<关键词>","limit":5}'
    note: "Tavily 额度超限/不可用时的替代搜索渠道；scrape 按量消耗 credits，能用免费链路时优先 SearXNG"

  brave:
    name: "Brave Search (MCP)"
    tier: 1
    harness: ["proma", "claude-code", "codex", "generic-mcp"]
    capability: [W1, W2, W4, W6, W7]
    cost: "$5 credits/月（免费，月度重置）"
    required: false
    tool_ref: "工具名 brave_web_search；W7 用 search_domain_filter/Goggles 指定官网；llm_context 免费档 400 不可用"
    install: |
      # 1. 注册 https://api-dashboard.search.brave.com/register
      # 2. 创建 API Key（BSAxxx）
      # 3. mcp.json 添加（stdio）：
      #    npx -y @brave/brave-search-mcp-server --transport stdio
      #    env.BRAVE_API_KEY=BSAxxx
      #    代理环境（国内必需）：NODE_USE_ENV_PROXY=1 + HTTPS_PROXY/HTTP_PROXY/ALL_PROXY
      #    注意：需确认本地代理（如 Clash）已启动，否则 fetch failed
    note: "英文/深度搜索强；免费档不支持 llm_context（400 OPTION_NOT_IN_PLAN）；深度抓正文用浏览器"

  museon:
    name: "Museon CLI (社交平台原生数据，含小红书)"
    tier: 1
    harness: ["proma", "claude-code", "codex", "generic-cli"]
    capability: [W3, W8]   # W3 口碑发现 + W8 实操经验/排障解法（小红书首发）
    w3_role: "discover"   # W3 第1阶段·发现（高召回原生样本）
    cost: "$0 免费档（跟踪 3 创作者）"
    required: true   # ← 必选渠道：W3 发现的核心通道
    install: |
      # 用户同意后，Agent 应自动检查 python3/uv 并安装；只有浏览器 OAuth 需要用户操作。
      # 可直接运行本 Skill 附带脚本：bash install-museon.sh
      # 手动参考（当前已核实 v0.5.19）：
      #   MUSEON_VERSION=0.5.19
      #   uv tool install "https://github.com/Museon-AI/museon-cli/releases/download/v${MUSEON_VERSION}/museoncli-${MUSEON_VERSION}-py3-none-any.whl"
      #   museoncli setup --agent auto
      #   museoncli auth status/start/finish --wait
      #   museoncli whoami
      # 最新版本号：https://github.com/Museon-AI/museon-cli/releases
    note: |
      小红书（笔记作者/点赞/评论/封面）+ X + Reddit + LinkedIn 原生数据。
      无登录态依赖，首轮信息密度高。搜索引擎（含 GPT/Claude 内置）抓不到社交原生内容，
      W3 场景不可替代。v3.3 起同时是 W8 实操排障/生活经验类问题的首发渠道：
      国产 App 设置、账号/权限/通知故障、生活服务实操等问题，小红书真人踩坑帖的
      解法命中率显著高于 SEO 网页搜索（实测：企业微信好友请求收不到等问题，
      通用搜索结果不可用，小红书可查到真实原因与设置路径）。

  agent-reach:
    name: "Agent Reach CLI (本地互联网路由器)"
    tier: 1
    harness: ["proma", "claude-code", "codex", "generic-cli"]
    capability: [W3, W4, W6, W2, W8]
    w3_role: "verify"   # W3 第2阶段·核验（读原帖/评论取证；W8 打开高赞解法帖核实步骤）
    cost: "免费（开源 CLI，零 API 费用）"
    required: false     # 推荐装：核验增强（不是硬必装，避免劝退新用户）
    install: |
      # 1. 安装 agent-reach（15 平台多后端路由器）
      #    安装指南：https://raw.githubusercontent.com/Panniantong/agent-reach/main/docs/install.md
      # 2. 小红书等平台需 Chrome 登录态（OpenCLI 桥接）
      # 3. 验证：agent-reach doctor --json 看 xiaohongshu active_backend
      # 4. 保持更新：agent-reach check-update
    note: |
      15 平台多后端：Exa/GitHub/YouTube/B站/V2EX/RSS + 需登录态的小红书/Reddit/X/IG。
      强在「打开原帖、读正文和评论、逐条核验」。可用性受浏览器扩展、登录态、
      平台风控影响。与 Museon 互补：Museon 发现 → Agent Reach 核验。

  kimi-webbridge:
    name: "Kimi WebBridge (本地浏览器控制)"
    tier: 1
    harness: ["codex", "chatgpt-desktop", "generic"]
    capability: [W3, W4, W6]
    cost: "免费（本地 daemon，控制用户真实浏览器）"
    required: false
    install: |
      # 本地浏览器控制 daemon，走用户已登录的浏览器会话。
      # 不调 Kimi API、不按量付费；适合 W3 降级或浏览器兜底。
      # 详情见其自身 SKILL.md（~/.codex/skills/kimi-webbridge/）
    note: "本质是浏览器自动化，质量依赖页面可读性；Museon/Agent Reach 都缺失时的 W3 降级方案"

  # ───────────── Tier 2：按量付费渠道 ─────────────
  zhipu:
    name: "智谱 Web Search (MCP)"
    tier: 2
    harness: ["proma", "claude-code", "codex", "generic-mcp"]
    capability: [W1, W2, W4, W5, W7]
    cost: "按量：Std 0.01 元 / Pro 0.03 元 / Quark·Sogou 0.05 元（每次）"
    required: false
    tool_ref: |
      官方 MCP 工具 webSearchStd/Pro/Quark/Sogou；社区封装 npx -y cc-zhipu-web-search 时工具名为 web-search，
      参数 query/search_engine(search_std/pro/quark/sogou)/count(3-8)/content_size/search_domain_filter/search_recency_filter。
      中文深度用 Pro/Quark（Std 相关性弱）；国内直连无需代理。
    install: |
      # 1. 注册 https://open.bigmodel.cn
      # 2. 创建 API Key（xxxx.xxxx）
      # 3. mcp.json 添加（type 必须是 http，不是 sse）：
      #    { "type": "http",
      #      "url": "https://open.bigmodel.cn/api/mcp-broker/proxy/web-search/mcp?Authorization=<你的Key>" }
    note: "中文搜索/深度报告强；国内直连无需代理；W8 实操排障弱（1 分），经验类只作官方信息补充"

# 默认优先级（Skill 决策时参考；用户可在自己环境覆盖）
# v3.3 起不再是固定按 tier 排序：经验类问题（W3≥2 或 W8≥2）社交原生渠道首发。
priority_default:
  factual:                # 纯事实/时效/专业类（W3≤1 且 W8≤1）：按成本档走
    - tier: 0             # 订阅内置搜索优先（沉没成本）
    - tier: 1             # 免费渠道次之
    - tier: 2             # 按量付费兜底
  experiential:           # 口碑/实操经验类（W3≥2 或 W8≥2）：社交原生优先
    - museon              # 小红书等社交原生数据首发（通用搜索抓不到、SEO 结果不可用）
    - tier: 0             # 内置搜索补官方规则/事实（不是首发）
    - tier: 1             # 免费网页渠道补充
    - tier: 2             # 按量付费兜底

# W8 实操排障/生活经验的首发平台偏好（中文语境默认小红书）
experiential_platforms:
  zh: ["xhs", "bilibili", "zhihu"]   # 国产 App/生活服务/职场场景：小红书 > B站 > 知乎
  en: ["reddit", "x", "youtube"]    # 英文场景：Reddit > X > YouTube

# Tier1 内部优先级（v3.4：自建零成本渠道优先于有额度上限的免费渠道）
# 仅适用于纯事实/时效/专业类通用搜索（W3≤1 且 W8≤1）；口碑/实操类仍社交首发，不在此序列。
tier1_order:
  - searxng-local   # $0 无上限（若已部署）→ 频繁搜索场景的主力，永远先试它
  - tavily          # 1000 credits/月
  - firecrawl       # 500 credits/月
  - brave           # $5/月
  - zhipu           # 按量付费，中文深度必要时才用（属于 tier2，此处仅示意额序）
  # museon / agent-reach 为 W3/W8 专用，不参与通用搜索排序

# 零成本组合链路（可选自建，不消耗任何额度）
# 适用 W1/W2/W4/W5/W6/W7；不适用 W3（社交口碑）——那仍需 Museon 发现 + Agent Reach 核验。
free_pipeline:
  discover: "searxng-local"              # 聚合搜索发现 URL
  extract: "jina-reader-local"           # 可选：http://127.0.0.1:8082/<url> 提取 Markdown 正文
  wrapper: "websearch-free.sh"           # 封装二者：~/.local/bin/websearch-free.sh（install-searxng.sh 附带）
  degrade_notes: |
    jina_reader_missing: websearch-free.sh 仍可用，但只返回搜索结果概览（标题+URL+摘要），
      需要正文时用浏览器/WebFetch 打开重点 URL；或退回 Tavily/Firecrawl 有额度渠道。

# W3 两阶段管线组合（v3.2 核心：发现 + 核验 互补，不替代）
w3_pipeline:
  discover: "museon"        # 第1阶段·发现：高召回原生样本
  verify: "agent-reach"     # 第2阶段·核验：读原帖/评论取证
  confirm: "official-docs"  # 第3阶段·确认：官方文档（仅价格/权益/功能变更时）
  degrade_notes:
    no_museon: "浏览器打开小红书/X 搜索；无法批量抓原生数据，质量明显下降"
    no_agent_reach: "Museon 发现 + 浏览器手动打开重点原帖；核验变慢，评论读取受限"
    both_missing: "浏览器直接搜；仅 SEO 可见内容，口碑质量低"
